<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에이블 정보통신 퀴즈</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: "Noto Sans KR", sans-serif;
            background-color: #f9fafb;
            text-align: center;
            padding: 30px;
        }
        .quiz-container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .question {
            margin-bottom: 20px;
            text-align: left;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .win { color: green; font-weight: bold; }
        .average { color: orange; font-weight: bold; }
        .lose { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-container">
        <h1>에이블과 함께하는 신나는 정보통신 퀴즈!</h1>
        <p>타이머: <span id="timer">60</span>초</p>

        <!-- 1페이지 -->
        <div class="question-page" id="page1">
            <div class="question">
                <h3>1. 컴퓨터끼리 데이터를 주고받는 것을 무엇이라고 할까요?</h3>
                <label><input type="radio" name="q1" value="1"> 통신</label><br>
                <label><input type="radio" name="q1" value="0"> 편지</label><br>
                <label><input type="radio" name="q1" value="0"> 비행기</label>
            </div>

            <div class="question">
                <h3>2. 스마트폰에서 무선으로 인터넷에 연결하는 방법은?</h3>
                <label><input type="radio" name="q2" value="0"> USB</label><br>
                <label><input type="radio" name="q2" value="1"> Wi-Fi</label><br>
                <label><input type="radio" name="q2" value="0"> HDMI</label>
            </div>

            <button onclick="nextPage(2)">다음</button>
        </div>

        <!-- 2페이지 -->
        <div class="question-page" id="page2" style="display:none;">
            <div class="question">
                <h3>3. 디지털 정보의 가장 작은 단위는?</h3>
                <label><input type="radio" name="q3" value="1"> 비트(bit)</label><br>
                <label><input type="radio" name="q3" value="0"> 바이트(byte)</label><br>
                <label><input type="radio" name="q3" value="0"> 페타바이트(PB)</label>
            </div>

            <div class="question">
                <h3>4. 인터넷에서 정보를 검색할 때 사용하는 프로그램은?</h3>
                <label><input type="radio" name="q4" value="1"> 웹 브라우저</label><br>
                <label><input type="radio" name="q4" value="0"> 문서 편집기</label><br>
                <label><input type="radio" name="q4" value="0"> 계산기</label>
            </div>

            <div class="question">
                <h3>5. 인터넷에서 정보를 주고받는 규칙을 무엇이라고 할까요?</h3>
                <label><input type="radio" name="q5" value="1"> 프로토콜</label><br>
                <label><input type="radio" name="q5" value="0"> 패킷</label><br>
                <label><input type="radio" name="q5" value="0"> 주소</label>
            </div>

            <button onclick="checkAnswers()">결과 확인</button>
        </div>

        <div class="result" id="result"></div>
        <div class="feedback" id="feedback"></div>
    </div>

    <script>
        // === 타이머 ===
        let timeLeft = 60;
        const timerElement = document.getElementById('timer');
        const resultElement = document.getElementById('result');
        const feedbackElement = document.getElementById('feedback');
        const timerInterval = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                resultElement.textContent = '시간이 다 되었어요! 결과를 확인하세요.';
                feedbackElement.innerHTML = '<span class="lose">타임 오버! 다시 도전해보세요!</span>';
            }
        }, 1000);

        // === 페이지 이동 ===
        function nextPage(page) {
            document.getElementById(`page${page - 1}`).style.display = 'none';
            document.getElementById(`page${page}`).style.display = 'block';
        }

        // === 정답 체크 및 결과 전송 ===
        function checkAnswers() {
            clearInterval(timerInterval);
            const correctAnswers = [1, 1, 1, 1, 1];
            let score = 0;
            for (let i = 1; i <= 5; i++) {
                const ans = document.querySelector(`input[name="q${i}"]:checked`);
                if (ans && ans.value == correctAnswers[i - 1]) score++;
            }

            resultElement.textContent = `당신의 점수는 ${score} / 5 입니다.`;
            if (score === 5) {
                feedbackElement.innerHTML = '<span class="win">완벽해요! 정보통신에 대해 잘 알고 있네요!</span>';
            } else if (score >= 3) {
                feedbackElement.innerHTML = '<span class="average">좋아요! 조금만 더 공부하면 금방 전문가!</span>';
            } else {
                feedbackElement.innerHTML = '<span class="lose">다시 도전해보세요!</span>';
            }

            // 이름 입력
            const name = prompt("이름을 입력하세요:");
            if (!name) return alert("이름을 입력해야 제출됩니다.");

            // === 구글 스크립트 주소 ===
            const scriptURL = "https://script.google.com/macros/s/AKfycbYOUR_URL_HERE/exec"; // 👈 여기에 본인 Apps Script 배포 URL 붙이기

            // 결과 전송
            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name, score: score }),
            })
            .then(res => res.text())
            .then(data => {
                alert("결과가 성공적으로 제출되었습니다!");
            })
            .catch(err => {
                console.error(err);
                alert("결과 전송 중 오류가 발생했습니다.");
            });
        }
    </script>
</body>
</html>
